      });
    }
    if (T.bos.length) {
      html += '<div class="tbbas">' + (!iki ? "İki kişilik oyunlar" : ayMod ? "Bu ay sırada bekleyenler" : "Henüz oynamadıklarımız") + "<small>ilk maçla skora girer</small></div><div class=\"tbbos\">" +
        T.bos.map(function (x) { return '<a href="' + (LINK[x.k] || "oyunlar.html") + '"' + (x.d && x.d.ben ? ' class="sira"' : "") + "><i aria-hidden=\"true\">" + (IK[x.k] || "🎲") + "</i>" + esc(OYUN[x.k]) + (x.d && x.d.ben ? "<em>" + esc(x.d.t) + "</em>" : "") + "</a>"; }).join("") + "</div>";
    }
    /* tek kişilik rekorlar: sadece bilgi, skora sayılmaz, kapalı gelir */
    var oz = list.map(function (p) { return ozet(p.d); }), rek = "";

    html += '<details class="tbdet" id="tbRek"' + (rekAcik ? " open" : "") + '><summary>Kendi rekorlarımız<small>skora sayılmaz</small></summary><div class="tbrekad">' + list.map(function (p) { return "<b>" + esc(adOf(p.uid)) + "</b>"; }).join("") + "</div>" + rek + "</details>";
    var grid = $("grid"), ilk = !grid.getAttribute("data-k") || grid.getAttribute("data-k") !== kapsam;
    grid.innerHTML = html; grid.className = "tbgrid" + (ilk ? " gir" : ""); grid.setAttribute("data-k", kapsam);
    var det = $("tbRek"); if (det) det.addEventListener("toggle", function () { rekAcik = det.open; });
    /* vitrin: toplam skor hep en üstte; "Bu ay" kupası ile "Genel" arasında geçiş */
    var a = sol === L0 ? T.p0 : T.p1, b = iki ? (sag === L0 ? T.p0 : T.p1) : 0, onde = !o || a === b ? null : a > b ? sol : sag, top = a + b;
    function durumK(u) { var p = oyuncular[u] || {}, t = p.son && p.son.t ? Hesap.tms(p.son.t) : 0, canli = t && now - t < 180000 && p.son.o && LINK[p.son.o]; return canli ? '<small class="on">şu an ' + esc(OYUN[p.son.o]) + " oynuyor</small>" : "<small>" + (t ? esc(nezaman(t)) : "henüz girmedi") + "</small>"; }
    function kisi(u) { return '<div class="tbvk' + (onde === u ? " onde" : "") + '"><span class="hsava ' + sinif(u) + '">' + esc(adOf(u).charAt(0)) + "</span>" + (onde === u ? '<i class="tbtac">👑</i>' : "") + "<b>" + esc(adOf(u)) + "</b>" + durumK(u) + "</div>"; }
    var gunSay = new Date(yy, mm + 1, 0).getDate(), kalan = gunSay - bugun.getDate(), unvan = onde ? ((oyuncular[onde] || {}).kul === "bus" ? "kraliçesi" : "kralı") : "";
    var alt = !iki ? "" : ayMod
      ? (top ? (onde ? "Şimdilik " + esc(AYUZUN[mm]) + " ayının " + unvan + " " + esc(adOf(onde)) + " · " + Math.abs(a - b) + " puan önde" : "Başa baş gidiyoruz") : esc(AYUZUN[mm]) + " kupası için ilk maçı oynayın")
      : (top ? (onde ? esc(adOf(onde)) + " " + Math.abs(a - b) + " puan önde · " + T.oynandi.length + " oyundan" : "Başa baş gidiyoruz") : "İlk düelloyu oynayın, skor başlasın");
    var skorK = kapsam + ":" + a + ":" + b, say = skorK !== sonSkor; sonSkor = skorK;
    $("vitrin").innerHTML = (iki ? '<div class="tbsek" role="tablist"><button type="button" role="tab" data-k="ay" class="' + (ayMod ? "on" : "") + '" aria-selected="' + ayMod + '">' + esc(AYUZUN[mm]) + ' kupası</button><button type="button" role="tab" data-k="genel" class="' + (ayMod ? "" : "on") + '" aria-selected="' + !ayMod + '">Genel</button></div>' : "") +
      '<div class="tbvs">' + kisi(sol) + '<div class="tbskor' + (say ? " say" : "") + '"><b data-n="' + a + '">' + a + "</b><span>–</span><b data-n=\"" + b + '">' + b + "</b><small>puan</small></div>" + kisi(sag) + "</div>" +
      (top ? '<span class="tbbar buyuk"><i class="' + sinif(sol) + '" style="width:' + Math.round(100 * a / top) + '%"></i><i class="' + sinif(sag) + '" style="width:' + (100 - Math.round(100 * a / top)) + '%"></i></span>' : "") +
      '<p class="tbvalt">' + alt + "</p>" +
      (ayMod ? '<div class="tbay"><span class="tbayb"><i style="width:' + Math.round(100 * bugun.getDate() / gunSay) + '%"></i></span><small>' + (kalan > 0 ? "kupanın sahibi " + kalan + " gün sonra belli olur" : "bugün son gün, kupa bu gece sahibini bulur") + "</small></div>" : "") +
      '<p class="tbnasil">' + (ayMod ? "Her ay 0–0'dan başlar. " : "") + "Her oyun maç başına 2 puan dağıtır, 5 maçta 10 puana dolar. Tek maç skoru uçurmaz; fark ancak çok kazandıkça açılır.</p>";
    $("mini").innerHTML = iki ? '<span class="hsava sm ' + sinif(sol) + '">' + esc(adOf(sol).charAt(0)) + "</span><b>" + a + "</b><span class=\"tbbar\">" + (top ? '<i class="' + sinif(sol) + '" style="width:' + Math.round(100 * a / top) + '%"></i><i class="' + sinif(sag) + '" style="width:' + (100 - Math.round(100 * a / top)) + '%"></i>' : "") + "</span><b>" + b + '</b><span class="hsava sm ' + sinif(sag) + '">' + esc(adOf(sag).charAt(0)) + "</span><small>" + (ayMod ? esc(AYUZUN[mm]) + " kupası" : "Genel") + "</small>" : "";
    if (say) sayAnim();
  }
  function sayAnim() {                                                /* skor rakamları 0'dan yukarı sayar */
    if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    var bs = $("vitrin").querySelectorAll(".tbskor b"), t0 = performance.now();
    (function adim(t) {
      var p = Math.min(1, (t - t0) / 650), e = 1 - Math.pow(1 - p, 3);
      [].forEach.call(bs, function (el) { if (!el.isConnected) return; el.textContent = Math.round(+el.getAttribute("data-n") * e); });
      if (p < 1) requestAnimationFrame(adim);
    })(t0);
  }
  function gunAd(ms) { var t = new Date(ms), b = new Date(); b.setHours(0, 0, 0, 0); var g = Math.round((b - new Date(t.getFullYear(), t.getMonth(), t.getDate())) / 86400000); return g === 0 ? "Bugün" : g === 1 ? "Dün" : t.getDate() + " " + AYLAR[t.getMonth()]; }
  function cizAkis() {
    var L = akis.filter(function (e) { return !kapali(e.o); }).slice(0, 40);
    if (!L.length) { $("feed").innerHTML = '<li class="tbempty">Henüz bir şey yok.</li>'; return; }

      return '<li><span class="hsava sm ' + (p.kul === "bus" ? "a" : "b") + '">' + esc(ad.charAt(0).toUpperCase()) + '</span><span class="tbft">' + esc(metin(e, ad)) + '<small>' + esc(nezaman(Hesap.tms(e.t))) + '</small></span></li>';
    }).join("");
  }
  $("vitrin").addEventListener("click", function (e) {
    var b = e.target && e.target.closest ? e.target.closest(".tbsek button") : null; if (!b) return;
    kapsam = b.getAttribute("data-k"); try { sessionStorage.setItem("tb_kapsam", kapsam); } catch (er) {}

  /* üstteki skor kutusu sayfayla birlikte kayar; ekrandan çıkınca tepede ince bir skor çubuğu belirir (sayfa düzeni hiç değişmez, takılma olmaz) */
  var miniGor = false, miniBekle = false;
  function miniBak() { miniBekle = false; var g = !$("wrap").hidden && $("vitrin").getBoundingClientRect().bottom < 4; if (g !== miniGor) { miniGor = g; $("mini").classList.toggle("gor", g); } }
  addEventListener("scroll", function () { if (!miniBekle) { miniBekle = true; requestAnimationFrame(miniBak); } }, { passive: true });
  var tik = setInterval(function () { if (!$("wrap").hidden) { ciz(); cizAkis(); } }, 30000);

  var basladi = false;

    var k = Hesap.kim();

        oyuncular = {}; snap.forEach(function (doc) { var p = doc.data(); p.uid = doc.id; if (p.kul) p.ad = Hesap.gorunenAd(p.kul); oyuncular[doc.id] = p; });

      }, function () { $("tbSub").textContent = "bağlantı yok"; });
      db.collection("hafiza").doc("seri").onSnapshot(function (snap) { seri = snap.exists ? snap.data() : null; ciz(); }, function () {});
      db.collection("hafiza").doc("mac").onSnapshot(function (snap) { mac = snap.exists ? snap.data() : null; ciz(); }, function () {});
      db.collection("satranc").doc("seri").onSnapshot(function (snap) { stSeri = snap.exists ? snap.data() : null; ciz(); }, function () {});
      db.collection("satranc").doc("mac").onSnapshot(function (snap) { stMac = snap.exists ? snap.data() : null; ciz(); }, function () {});

      });
      var simdi = new Date(), buAy = new Date(simdi.getFullYear(), simdi.getMonth(), 1);
      db.collection("akis").where("t", ">=", buAy).orderBy("t", "desc").limit(4000).onSnapshot(function (snap) {      /* bu ayın maçları, canlı */
        ayAkis = []; snap.forEach(function (doc) { ayAkis.push(doc.data()); }); ciz();
      }, function () { ayAkis = []; ciz(); });
      gecYukle = function (bas) {                                                                                   /* biten aylar: hepsi, sayfa sayfa (sınır yüzünden maç kaçmasın) */
        if (gecBasladi) return; gecBasladi = true;
        var hepsi = [];
        (function sayfa(son) {
          var q = db.collection("akis").where("t", ">=", bas).where("t", "<", buAy).orderBy("t").limit(1000);
          if (son) q = q.startAfter(son);
          q.get().then(function (snap) {
            snap.forEach(function (doc) { hepsi.push(doc.data()); });
            if (snap.size >= 1000 && hepsi.length < 40000) sayfa(snap.docs[snap.docs.length - 1]); else { gecAkis = hepsi; gecTam = true; ciz(); }
          }).catch(function () { gecBasladi = false; });
        })(null);
      };
      ciz();
      db.collection("akis").orderBy("t", "desc").limit(150).onSnapshot(function (snap) {
        akis = []; snap.forEach(function (doc) { akis.push(doc.data()); }); ciz(); cizAkis();
      }, function () {});
    }, function () { $("tbSub").textContent = "bağlantı yok"; });
  }
  Hesap.izle(function () { basla(); });
  Hesap.hazir(function () { if (!Hesap.kim()) basla(); });
  $("cikis").onclick = function () { this.disabled = true; Hesap.cikis().then(function () { location.href = "oyunlar.html"; }, function () { location.href = "oyunlar.html"; }); };
  $("yedek").onclick = function () {
    var out = { zaman: new Date().toISOString(), oyuncular: oyuncular, akis: akis }, s = JSON.stringify(out, function (k, v) { return v && typeof v.toMillis === "function" ? v.toMillis() : v; }, 2);
    try { var b = new Blob([s], { type: "application/json" }), u = URL.createObjectURL(b), a = document.createElement("a"); a.href = u; a.download = "queen-games-yedek-" + ymd(new Date()) + ".json"; document.body.appendChild(a); a.click(); setTimeout(function () { document.body.removeChild(a); URL.revokeObjectURL(u); }, 1500); } catch (e) { alert("Yedek alınamadı."); }
  };
})();
