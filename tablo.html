    /* 6) rekorlar (tek kişilik) */
    var oz = L.map(function (p) { return ozet(p.d); }), html = "";
    for (var r = 0; r < oz[0].length; r++) {
      if (oz.every(function (z) { return !z[r].v; })) continue;
      var best = -1; if (L.length > 1) { var m = Math.max(oz[0][r].v, oz[1][r].v); if (m > 0 && oz[0][r].v !== oz[1][r].v) best = oz[0][r].v > oz[1][r].v ? 0 : 1; }

  function gunAd(ms) { var t = new Date(ms), b = new Date(); b.setHours(0, 0, 0, 0); var g = Math.round((b - new Date(t.getFullYear(), t.getMonth(), t.getDate())) / 86400000); return g === 0 ? "Bugün" : g === 1 ? "Dün" : t.getDate() + " " + AYLAR[t.getMonth()]; }
