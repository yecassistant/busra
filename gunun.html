<body data-page="gunun">

<main class="gk" id="stage">
  <header class="gkbar">
    <a class="gkbtn" href="oyunlar.html" aria-label="Geri"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5.5L8 12l6.5 6.5"/></svg></a>
    <div class="gktitle"><b>Günün Kelimesi</b><span id="gkDate"></span></div>
    <div class="gkbtns">
      <button type="button" class="gkbtn" id="bStats" aria-label="İstatistik"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 19v-6M12 19V6M18 19v-9"/></svg></button>

    </div>
  </header>

  <div class="gkboardwrap" id="wrap">
    <div class="gktoast" id="toast" role="status" aria-live="polite"></div>
    <div class="gkboard" id="board" aria-label="Tahminler"></div>
  </div>

  <div class="gkkeys" id="keys" aria-label="Klavye"></div>
</main>

<div class="gkover" id="help" hidden>
  <div class="gkcard">
    <h2>Günün Kelimesi</h2>
    <p>Her gün yeni bir kelime. 5 harfli kelimeyi 5 tahminde bul.</p>
    <div class="gkex" aria-hidden="true"><span class="gkt sm g">K</span><span class="gkt sm y">A</span><span class="gkt sm x">L</span><span class="gkt sm g">E</span><span class="gkt sm x">M</span></div>
    <ul class="gklegend">
      <li><span class="gkt xs g"></span><span><b>Yeşil:</b> harf doğru yerde</span></li>
      <li><span class="gkt xs y"></span><span><b>Sarı:</b> harf var ama başka yerde</span></li>
      <li><span class="gkt xs x"></span><span><b>Renksiz:</b> harf kelimede yok</span></li>
    </ul>
    <p class="gksmall">Tahminin sözlükte olan bir kelime olmalı. Kelime her gece yarısı yenilenir.</p>
    <button type="button" class="gkprimary" id="helpGo">Başla</button>
  </div>
</div>

<div class="gkover" id="done" hidden>
  <div class="gkcard">
    <div class="gkkick" id="doneKick">Günün kelimesi</div>

    <p class="gkmean" id="doneMean"></p>
    <div class="gkstats" id="doneStats"></div>
    <div class="gkdist" id="doneDist"></div>
    <p class="gknext" id="doneNext"></p>
    <div class="gkbtnrow"><button type="button" class="gkghost" id="doneClose">Tahtaya bak</button><a class="gkprimary" href="oyunlar.html">Menü</a></div>
  </div>
</div>
