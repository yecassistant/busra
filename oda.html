<!DOCTYPE html>
<html lang="tr">
<head>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link rel="stylesheet" href="style.css?v=1017d">
</head>
<body data-page="oda" data-tone="lav">

<main class="stage oda">
  <div class="gtop">
    <a class="gback" href="index.html">← Geri</a>
    <div class="gtitle"><b>Şefin Odası</b><small>Büşranur'a özel 🛋️</small></div>
    <div class="gscore"><span>Parça <b id="cnt">0</b></span></div>
  </div>

  <div class="roomwrap">
    <svg class="room" id="oda" viewBox="0 0 400 320" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
      <rect id="wall" x="0" y="0" width="400" height="215" fill="#e9e1f7"/>
      <rect id="floor" x="0" y="215" width="400" height="105" fill="#e3c9a3"/>
      <g id="planks"></g>
      <rect id="skirt" x="0" y="211" width="400" height="6" fill="#fbfaf7"/>
      <g id="items"></g>
    </svg>
    <div class="odaHint" id="odaHint"></div>
  </div>

  <div class="tools" id="toolsRoom">
    <button type="button" class="tb" id="rWall">Duvar</button>
    <button type="button" class="tb" id="rFloor">Zemin</button>
    <button type="button" class="tb icon" id="rShare" title="Paylaş" aria-label="Paylaş">📷</button>
    <button type="button" class="tb icon" id="rClear" title="Boşalt" aria-label="Boşalt">🗑</button>
    <button type="button" class="tb main" id="rCheck">Şef onayı ✓</button>
  </div>
  <div class="tools" id="toolsSel" hidden>
    <button type="button" class="tb" id="tColor">Renk 🎨</button>
    <button type="button" class="tb icon" id="tFlip" title="Çevir">↔</button>
    <button type="button" class="tb icon" id="tBig" title="Büyüt">＋</button>
    <button type="button" class="tb icon" id="tSmall" title="Küçült">－</button>
    <button type="button" class="tb icon" id="tDel" title="Kaldır">🗑</button>
    <button type="button" class="tb main" id="tDone">Tamam</button>
  </div>

  <div class="trayh" id="tray"></div>
</main>

<div class="over" id="over" hidden>
  <div class="overcard">
    <div class="eyebrow">şef onayı 🏗️</div>
    <h2><em id="ovScore">0/10</em></h2>
    <p class="lead" id="ovTitle"></p>
    <ul class="ovNotes" id="ovNotes"></ul>
    <div class="btns"><button type="button" class="btn pink" id="ovClose">Devam et</button><button type="button" class="btn ghost" id="ovShare">📷 Paylaş</button><a class="btn ghost" href="kase.html">Peki Madem (: 🍉</a></div>
  </div>
</div>

<div class="lightbox" id="lightbox" hidden>
  <div class="lbwrap"><img id="lbImg" alt="Odanın görseli"></div>
  <p>Görsele basılı tut → Fotoğraflara kaydet. Kapatmak için dokun.</p>
</div>

<script src="app.js?v=1017d"></script>
<script src="oda.js?v=1017d"></script>
</body>
</html>
