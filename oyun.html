<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Şefin Planı</title>
<meta name="description" content="Çiçekli blok bulmaca: kat planını doldur.">
<meta property="og:title" content="Şefin Planı 🧩">
<meta property="og:description" content="Yatarken canın sıkılırsa: çiçekli blok bulmaca.">
<meta name="color-scheme" content="light">
<meta property="og:type" content="website">
<meta property="og:image" content="https://yecassistant.github.io/busranur/onizleme.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#ec6f9a">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%8C%B8%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,600&family=Nunito:wght@600;700;800&family=Caveat:wght@600;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="oyun" data-tone="lil">

<main class="stage game">
  <div class="eyebrow">Büşranur'a özel 🌿</div>
  <h2>Şefin <em>Planı</em></h2>
  <p class="lead">Bahçe planını çiçeklerinle doldur: parçayı sürükle ya da seç, sonra plana dokun. Yan yana gelen çiçekleri sarmaşık bağlar; satır ya da sütun dolunca açar.</p>
  <div class="legend">
    <span class="lg f-lav"></span> lavanta <span class="lg f-peo"></span> şakayık <span class="lg f-lil"></span> lilyum
  </div>

  <div class="scorebar">
    <div><small>Puan</small><b id="score">0</b></div>
    <div><small>En iyi</small><b id="best">0</b></div>
  </div>

  <div class="boardwrap">
    <div class="board" id="board"></div>
    <svg class="vines" id="vines" aria-hidden="true"></svg>
  </div>
  <p class="hint" id="gmsg"></p>
  <div class="tray" id="tray"></div>

  <div class="btns" style="min-height:0">
    <button type="button" class="btn ghost" id="restart">Yeni proje</button>
    <a class="btn link" href="index.html">Geri dön</a>
  </div>
</main>

<div class="over" id="over" hidden>
  <div class="overcard">
    <div class="eyebrow">bahçe teslim 🏗️</div>
    <h2>Puan: <em id="overScore">0</em></h2>
    <p class="lead" id="overText"></p>
    <div class="btns"><button type="button" class="btn pink" id="again2">Yeni proje</button><a class="btn ghost" href="index.html">Geri dön</a></div>
  </div>
</div>

<script src="app.js"></script>
<script src="oyun.js"></script>
</body>
</html>
